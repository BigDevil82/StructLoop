[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "structloop"
version = "0.1.0"
description = "Minimal residential shear-wall design tool adapters"
requires-python = ">=3.11"
dependencies = ["numpy==1.26.4", "PyYAML==6.0.3", "pydantic==2.12.3"]

[project.optional-dependencies]
runtime = [
  "torch==2.5.1+cu124", "torch-geometric==2.7.0", "pandas==3.0.1",
  "scikit-learn==1.8.0", "scipy==1.17.1", "shapely==2.1.2", "ezdxf==1.4.2",
  "networkx==3.6.1", "openseespy==3.8.0.0", "pyarrow==23.0.1", "lightgbm==4.6.0",
]
test = ["pytest==8.4.2"]
etabs = ["comtypes==1.4.17; sys_platform == 'win32'", "psutil==7.2.2"]

[project.scripts]
structloop = "struct_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = ["real: explicitly enabled local weights / OpenSees regression"]
